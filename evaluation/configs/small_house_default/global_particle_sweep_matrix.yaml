experiment:
  name: small_house_default_global_particle_sweep
  seeds: [42, 73, 1001]
  frame_stride: 8
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: false
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: maps/map.yaml
  thresholds:
    failure_translation_m: 0.2
    failure_yaw_deg: 10.0
    lost_translation_m: 0.5
    lost_yaw_deg: 20.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [30000]

modes:
  global:
    particle_counts: [250, 500, 1000, 1250, 1500, 2000]

scenarios:
  - scenario_id: small_house_default
    splat_csv: evaluation/configs/small_house_default/splats.csv
    paths:
      - path_id: route
        manifest: evaluation/artifacts/datasets/small_house/default/default_small_house_route/manifest.json
