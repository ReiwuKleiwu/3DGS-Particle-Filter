experiment:
  name: small_house_default_local_stride4_test
  seeds: [1001]
  frame_stride: 4
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local]
    seeds: [1001]
    path_ids: [route]
    splat_ids: [default_small_house_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: maps/map.yaml
  thresholds:
    failure_translation_m: 0.2
    failure_yaw_deg: 10.0
    lost_translation_m: 0.5
    lost_yaw_deg: 20.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [30000]

modes:
  local:
    particle_count: 500
    prior_offsets:
      - dx: 0.00
        dy: 0.00
        dyaw_degrees: 0.0

scenarios:
  - scenario_id: small_house_default
    splat_csv: splats.csv
    paths:
      - path_id: route
        manifest: ../../../evaluation/artifacts/datasets/small_house/default/default_small_house_route/manifest.json
