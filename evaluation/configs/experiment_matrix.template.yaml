experiment:
  name: small_house_main_study
  seeds: [1001, 1002, 1003, 1004, 1005]
  frame_stride: 5
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: false
    frame_stride: 1
    modes: [global]
    seeds: [1001]
    path_ids: [route_1]
    splat_ids: [default_small_house_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: map.yaml
  thresholds:
    failure_translation_m: 0.5
    failure_yaw_deg: 20.0
    lost_translation_m: 0.75
    lost_yaw_deg: 30.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [1000, 2000, 3000, 5000, 8000, 12000, 18000, 30000]

modes:
  local:
    particle_count: 500
    prior_offsets:
      - dx: 0.20
        dy: 0.0
        dyaw_degrees: 5.0
      - dx: 0.40
        dy: 0.0
        dyaw_degrees: 10.0
      - dx: 0.50
        dy: 0.0
        dyaw_degrees: 15.0
  global:
    particle_count: 2000

scenarios:
  - scenario_id: default_small_house
    splat_csv: evaluation/configs/default_small_house_splats.csv
    paths:
      - path_id: route_1
        manifest: evaluation/artifacts/datasets/default_small_house/default_small_house_route_1/manifest.json
      - path_id: route_2
        manifest: evaluation/artifacts/datasets/default_small_house/default_small_house_route_2/manifest.json
