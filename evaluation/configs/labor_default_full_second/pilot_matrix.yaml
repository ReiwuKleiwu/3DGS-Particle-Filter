experiment:
  name: labor_default_full_second_pilot
  seeds: [1001]
  frame_stride: 1
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local]
    seeds: [1001]
    path_ids: [labor_default_full_second]
    splat_ids: [labor_default_full_second_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: false
  map_yaml: ../../../cps_labor_map.yaml
  thresholds:
    failure_translation_m: 0.35
    failure_yaw_deg: 15.0
    lost_translation_m: 0.75
    lost_yaw_deg: 30.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 3

splats:
  iterations: [30000]

modes:
  local:
    particle_count: 512
    prior_offsets:
      - dx: 0.00
        dy: 0.00
        dyaw_degrees: 0.0

scenarios:
  - scenario_id: labor_default_full_second
    splat_csv: splats.csv
    paths:
      - path_id: labor_default_full_second
        manifest: ../../../evaluation/artifacts/datasets/labor_default_full_second/manifest.json
