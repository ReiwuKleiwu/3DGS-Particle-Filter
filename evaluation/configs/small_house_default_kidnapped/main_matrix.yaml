experiment:
  name: small_house_default_kidnapped_main
  seeds: [42, 73, 1001]
  frame_stride: 4
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local, global]
    seeds: [42]
    path_ids: [route]
    splat_ids: [default_small_house_01000, default_small_house_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: maps/map.yaml
  thresholds:
    failure_translation_m: 0.2
    failure_yaw_deg: 10.0
    lost_translation_m: 0.5
    lost_yaw_deg: 20.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [1000, 3000, 8000, 18000, 30000]

modes:
  local:
    particle_count: 500
    prior_offsets:
      - dx: 0.00
        dy: 0.00
        dyaw_degrees: 0.0
  global:
    particle_count: 1500

scenarios:
  - scenario_id: small_house_default_kidnapped
    splat_csv: ../small_house_default/splats.csv
    paths:
      - path_id: route
        manifest: ../../../evaluation/artifacts/datasets/small_house_default_kidnapped/manifest.json
