experiment:
  name: cps_labor_default_kidnapped_pilot
  seeds: [1001]
  frame_stride: 1
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [global]
    seeds: [1001]
    path_ids: [default_kidnapped]
    splat_ids: [cps_labor_default_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: ../../../cps_labor_map.yaml
  thresholds:
    failure_translation_m: 0.35
    failure_yaw_deg: 15.0
    lost_translation_m: 0.75
    lost_yaw_deg: 30.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 3

splats:
  iterations: [30000]

modes:
  global:
    particle_count: 1500

scenarios:
  - scenario_id: cps_labor_default_kidnapped
    splat_csv: ../cps_labor_default/splats.csv
    paths:
      - path_id: default_kidnapped
        manifest: ../../../evaluation/artifacts/datasets/cps_labor/default_kidnapped/manifest.json
