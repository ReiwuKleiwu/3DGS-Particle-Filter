renderer:
  backend: vkdiff
  # backend: gsplat
  base_url: http://127.0.0.1:8000
  wait_timeout_seconds: 30.0
  request_timeout_seconds: 30.0
  poll_interval_seconds: 0.5
  score_batch_size: 16
  include_best_render_preview: true
  #splat_map_x: 0.034 # small_house
  #splat_map_y: -0.028 # small_house
  splat_map_x: -0.016483
  splat_map_y: 0.025263
  splat_map_scale: 0.956853
  splat_map_scale_x: 1.0
  splat_map_scale_y: 1.0
  splat_map_yaw_degrees: 4.128334


map:
  yaml_path: cps_labor_map.yaml

camera_override:
    fx_scale: 1.7777714591
    fy_scale: 1.7777714591
    cx_offset: 0.0
    cy_offset: 0.0


ros:
  image_topic: /robot_1/oakd/rgb/preview/image_raw
  camera_info_topic: /robot_1/oakd/rgb/preview/camera_info
  odometry_topic: /robot_1/odom
  amcl_pose_topic: /robot_1/amcl_pose
  map_frame: map
  base_frame: base_link
  tf_lookup_mode: latest
  tf_timeout_seconds: 0.5
  require_odometry: true

runtime:
  observation_ready_timeout_seconds: 10.0
  spin_timeout_seconds: 0.05
  random_seed: 42
  suspend_updates_when_stationary: false
  stationary_translation_threshold_meters: 0.01
  stationary_yaw_threshold_radians: 0.01

particle_filter:
  particle_count: 256
  resample_threshold_ratio: 0.4980265853932951
  roughening_enabled: true
  roughening_mode: always
  roughening_ratio: 0.10
  roughening_sigma_x: 0.30
  roughening_sigma_y: 0.30
  roughening_sigma_yaw: 0.20

initial_pose_prior:
  mean:
    x: -2.685
    y: -2.003
    yaw: -0.020
  sigma_x: 0.5189956229836866
  sigma_y: 0.4033021036665101
  sigma_yaw: 0.5269711152318212

motion_noise:
  x_meters: 0.03715267516347767
  y_meters: 0.03215772063751061
  yaw_radians: 0.06844335442874377

measurement:
  metric_name: lpips
  temperature: 0.0146428187424423
  packed: false
  radius_clip: 3.0
  hybrid_ssim_weight: 0.50
  hybrid_l1_weight: 0.25
  hybrid_gradient_weight: 0.25
  lpips_top_k: 8
  lpips_weight: 0.25
  lpips_net: alex

initialization:
  mode: local
  global_yaw_uniform: true

recovery:
  enabled: true
  strategy: absolute_score
  alpha_slow: 0.001
  alpha_fast: 0.1
  random_particle_floor_ratio: 0.0
  random_particle_max_ratio: 0.25
  absolute_score_profiles:
    lpips:
      best_score_threshold: 0.60
      median_score_threshold: 0.65
      random_particle_ratio: 0.25
      consecutive_bad_updates: 5

adaptive_particle_count:
  enabled: false
  min_particle_count: 128
  medium_particle_count: 256
  max_particle_count:
  stable_required_updates: 8
  unstable_required_updates: 2
  xy_spread_stable_meters: 0.30
  xy_spread_unstable_meters: 0.75
  yaw_spread_stable_radians: 0.20
  yaw_spread_unstable_radians: 0.60
  best_score_stable_threshold: 0.45
  median_score_stable_threshold: 0.50

visualization:
  enabled: true
  publish_url: http://127.0.0.1:8090/api/publish-latest
  request_timeout_seconds: 0.25
  observation_jpeg_quality: 80

control:
  enabled: true
  poll_url: http://127.0.0.1:8090/api/reset-particle-filter/next
  request_timeout_seconds: 0.05
