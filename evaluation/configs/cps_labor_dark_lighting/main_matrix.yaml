experiment:
  name: cps_labor_dark_lighting_main
  seeds: [42, 73, 1001]
  frame_stride: 1
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local, global]
    seeds: [42]
    path_ids: [default]
    splat_ids: [iter_01000, iter_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: ../../../cps_labor_map.yaml
  thresholds:
    failure_translation_m: 0.35
    failure_yaw_deg: 15.0
    lost_translation_m: 0.75
    lost_yaw_deg: 30.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 3

splats:
  iterations: [1000, 3000, 8000, 18000, 30000]

modes:
  local:
    particle_count: 500
    prior_offsets:
      - dx: 0.25
        dy: 0.10
        dyaw_degrees: 5.0
      - dx: 0.75
        dy: 0.40
        dyaw_degrees: 15.0
      - dx: 1.50
        dy: 0.75
        dyaw_degrees: 35.0
  global:
    particle_count: 1500

scenarios:
  - scenario_id: cps_labor_dark_lighting
    splat_csv: ../cps_labor_default/splats_main.csv
    paths:
      - path_id: default
        manifest: ../../../evaluation/artifacts/datasets/cps_labor/dark_lighting/manifest.json
