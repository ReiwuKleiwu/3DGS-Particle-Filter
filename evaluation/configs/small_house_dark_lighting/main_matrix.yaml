experiment:
  name: small_house_dark_lighting_main
  seeds: [42, 73, 1001]
  frame_stride: 8
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local, global]
    seeds: [42]
    path_ids: [route_1, route_2, route_3, route_4]
    splat_ids: [default_small_house_01000, default_small_house_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: map.yaml
  thresholds:
    failure_translation_m: 0.2
    failure_yaw_deg: 10.0
    lost_translation_m: 0.5
    lost_yaw_deg: 20.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [1000, 3000, 8000, 18000, 30000]

modes:
  local:
    particle_count: 512
    prior_offsets:
      - dx: 1.00
        dy: 0.50
        dyaw_degrees: 10.0
  global:
    particle_count: 2000

scenarios:
  - scenario_id: small_house_dark_lighting
    splat_csv: evaluation/configs/small_house_dark_lighting/splats.csv
    paths:
      - path_id: route_1
        manifest: evaluation/artifacts/datasets/dark_lighting_small_house/dark_lighting_small_house_route_1/manifest.json
      - path_id: route_2
        manifest: evaluation/artifacts/datasets/dark_lighting_small_house/dark_lighting_small_house_route_2/manifest.json
      - path_id: route_3
        manifest: evaluation/artifacts/datasets/dark_lighting_small_house/dark_lighting_small_house_route_3/manifest.json
      - path_id: route_4
        manifest: evaluation/artifacts/datasets/dark_lighting_small_house/dark_lighting_small_house_route_4/manifest.json
