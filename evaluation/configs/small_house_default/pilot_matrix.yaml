experiment:
  name: small_house_default_pilot
  seeds: [1001]
  frame_stride: 10
  gpu_memory_poll_stride: 1
  record_particles:
    enabled: true
    frame_stride: 1
    modes: [local, global]
    seeds: [1001]
    path_ids: [route_1]
    splat_ids: [default_small_house_30000]
  backend: vkdiff
  port: 8000
  restart_renderer: true
  map_yaml: map.yaml
  thresholds:
    failure_translation_m: 0.2
    failure_yaw_deg: 10.0
    lost_translation_m: 0.5
    lost_yaw_deg: 20.0
    convergence_translation_m: 0.25
    convergence_yaw_deg: 10.0
    convergence_consecutive_frames: 5

splats:
  iterations: [1000, 30000]

modes:
  local:
    particle_count: 512
    prior_offsets:
      - dx: 1.0
        dy: 0.50
        dyaw_degrees: 10.0
  global:
    particle_count: 2000

scenarios:
  - scenario_id: small_house_default
    splat_csv: evaluation/configs/small_house_default/splats.csv
    paths:
      - path_id: route_1
        manifest: evaluation/artifacts/datasets/default_small_house_route_1/manifest.json
